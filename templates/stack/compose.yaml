# Wzór compose dla stacka. Skopiuj do hosts/<host>/services/<stack>/compose.yaml i dostosuj.
# Zasady: tag obrazu przypięty (nie latest), restart policy, porty na konkretnym adresie
# (IP LAN albo 127.0.0.1 - nigdy "8080:80", bo to 0.0.0.0), dane w ./data (bind mount),
# sekrety przez .env (deploys/compose_stacks.py tworzy go z hosts/<host>/secrets/<stack>.sops.yaml).
services:
  app:
    image: traefik/whoami:v1.10
    restart: unless-stopped
    ports:
      - "192.168.0.10:8080:80"   # <IP_LAN hosta>:<port na hoście>:<port kontenera>
    # env_file: .env             # odkomentuj, gdy stack ma sekrety
    # volumes:
    #   - ./data:/data           # stan aplikacji - to backupujemy
